name: Release

# Pushing a vX.Y.Z tag publishes the container image that server.json points to
# (ghcr.io/beg-lag/mcp-leyes:X.Y.Z). Publishing server.json to the MCP Registry is a
# separate, manual step: mcp-publisher login github && mcp-publisher publish.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/beg-lag/mcp-leyes

jobs:
  verify:
    name: Version, tests and server.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Tag, package version and server.json agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          package="$(uv run --frozen mcp-leyes --version | cut -d' ' -f2)"
          server="$(jq -r .version server.json)"
          image="$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)"
          echo "tag=$tag package=$package server.json=$server image=$image"
          test "$package" = "$tag"
          test "$server" = "$tag"
          test "$image" = "$IMAGE:$tag"
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest
      - name: Validate server.json against the official MCP Registry schema
        run: uvx check-jsonschema@0.39.0 --schemafile "$(jq -r '.["$schema"]' server.json)" server.json

  image:
    name: Publish container image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ${{ env.IMAGE }}
          # semver tags also get "latest" automatically (flavor latest=auto).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=mcp-leyes
            org.opencontainers.image.description=MCP server for Mexican federal law at any point in time (leyes-mx)
          annotations: |
            org.opencontainers.image.title=mcp-leyes
            org.opencontainers.image.description=MCP server for Mexican federal law at any point in time (leyes-mx)
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: MCP handshake and offline query against the published image
        run: >
          uv run --frozen python scripts/smoke_stdio.py --query --
          docker run -i --rm --network none -e MCP_LEYES_REFRESH_HOURS=0
          "$IMAGE:${GITHUB_REF_NAME#v}"
      - name: Ownership label on every platform matches server.json
        run: |
          ref="$IMAGE:${GITHUB_REF_NAME#v}"
          expected="$(jq -r .name server.json)"
          config="$(docker buildx imagetools inspect "$ref" --format '{{ json .Image }}')"
          for platform in linux/amd64 linux/arm64; do
            label="$(jq -r --arg p "$platform" \
              '.[$p].config.Labels["io.modelcontextprotocol.server.name"]' <<< "$config")"
            echo "$platform: $label"
            test "$label" = "$expected"
          done
