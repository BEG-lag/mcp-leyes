[project]
name = "mcp-leyes"
version = "1.0.0"
description = "MCP server for Mexican federal law at any point in time: articles as in force on a date, their history, reform diffs and full-text search, backed by the leyes-mx git history."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Benjamín Esponda García" }]
requires-python = ">=3.12"
keywords = [
    "mcp",
    "model-context-protocol",
    "fastmcp",
    "mexico",
    "law",
    "legislation",
    "leyes",
    "git",
    "legaltech",
    "dof",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Legal Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Spanish",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastmcp>=4.2,<5",
    "pyyaml>=6.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.urls]
Homepage = "https://github.com/BEG-lag/mcp-leyes"
Repository = "https://github.com/BEG-lag/mcp-leyes"
Issues = "https://github.com/BEG-lag/mcp-leyes/issues"
Data = "https://github.com/BEG-lag/leyes-mx"
Author = "https://pivotek.mx"

[project.scripts]
mcp-leyes = "mcp_leyes.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_leyes"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "live: uses the real leyes-mx repository (opt in with --live or MCP_LEYES_LIVE=1)",
]
filterwarnings = ["ignore::DeprecationWarning:websockets.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "C4"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Fixture law texts and commit messages keep one paragraph per line, as leyes-mx does.
"tests/conftest.py" = ["E501"]
